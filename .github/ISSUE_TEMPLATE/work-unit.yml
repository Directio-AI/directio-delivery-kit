name: Unidad de trabajo
description: Una pieza de trabajo para una persona o un agente
labels: ["needs-human"]
body:
  - type: textarea
    id: goal
    attributes:
      label: Objetivo
      description: Qué debe ser cierto cuando esto esté terminado, en una o dos oraciones.
    validations:
      required: true
  - type: textarea
    id: done-when
    attributes:
      label: Terminado cuando
      description: Una verificación que cualquiera pueda ejecutar (una prueba, un comando, un archivo que existe). No "se ve bien".
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Archivos en alcance
      description: Rutas que el trabajo puede cambiar. Todo lo demás está fuera de alcance.
    validations:
      required: true
  - type: dropdown
    id: data-class
    attributes:
      label: Clase de datos
      options: [Pública, Confidencial de negocio, Personal, Sensible]
    validations:
      required: true
  - type: dropdown
    id: autonomy
    attributes:
      label: Nivel de autonomía
      options:
        - "1: el agente propone, una persona ejecuta"
        - "2: el agente ejecuta, una persona aprueba cada paso"
        - "3: el agente ejecuta, una persona aprueba el PR"
    validations:
      required: true
  - type: input
    id: budget
    attributes:
      label: Presupuesto
      description: Tope de tiempo o costo, por ejemplo "2 sesiones de agente" o "US$5 de uso de API".
    validations:
      required: true
  - type: dropdown
    id: artifacts
    attributes:
      label: Cadena de artefactos
      options:
        - Completa (intención, especificación, plan)
        - Solo plan
        - Ninguna (documentación o configuración sin cambio de comportamiento)
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Contexto y enlaces
